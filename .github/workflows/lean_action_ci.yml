name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Mathlib's compiled files take most of the runner's disk; remove preinstalled toolchains
      # that the build does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      # `lake build` builds only the modules of the required libraries that this repository
      # imports; the audit reads all of them (lean4-phylogenetics, docs/CONVENTIONS.md, Section 3).
      - name: Build the libraries that the audit reads
        run: lake build Phylogenetics PhyloNetwork Allman2011
      # The audit sees a module's proofs only through its own `import all` line: every module of
      # Camus/ (Basic/, External/ and the paper's library), the paper's Solution in palomar/, but
      # not the Challenge (it holds a copy of the paper's definitions), and every module of
      # Phylogenetics and Allman2011.
      - name: Check that the audit imports every module of the libraries
        run: |
          diff <({ find Camus -name '*.lean'; cd palomar && find . -name Solution.lean; } \
            | sed 's#^\./##; s/\.lean$//; s#/#.#g' | sort) \
            <(grep -E '^import all Camus\.' scripts/Audit.lean | sed 's/^import all //' | sort)
          for p in Phylogenetics Allman2011; do
            diff <(cd .lake/packages/$p && find $p -name '*.lean' | sed 's/\.lean$//; s#/#.#g' | sort) \
              <(grep -E "^import all $p\." scripts/Audit.lean | sed 's/^import all //' | sort)
          done
      - name: Audit axioms and dependencies
        run: lake env lean scripts/Audit.lean
      # The routes of the paper's proofs (docs/Camus/paper_routes.tsv) and the reviewed differences
      # (docs/Camus/route_differences.tsv); see the skill's SKILL.md, "Faithful proofs".
      - name: Check that the proofs follow the routes of the paper's proofs
        run: >-
          python3 scripts/route_check.py check docs/Camus/paper_routes.tsv
          --accept docs/Camus/route_differences.tsv
      # The copy of Camus/Defs.lean in palomar/Camus/Challenge.lean.
      - name: Check that the Challenge's copy of the shared definitions is current
        run: python3 scripts/sync_challenge_defs.py --check
      - name: Check that the documentation's links to the code are current
        run: python3 scripts/linkify_docs.py --check
      - name: Check the Markdown tables
        run: >-
          python3 scripts/check_md_tables.py README.md
          docs/Camus/REPORT.md docs/Camus/CREDITS.md
          Camus/Basic/README.md Camus/External/README.md Camus/External/*/README.md
