name = "Camus"
version = "0.1.0"
keywords = ["math", "phylogenetics"]
defaultTargets = ["Camus", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false
maxSynthPendingDepth = 3

# The root of the collection: the shared library of phylogenetics.
[[require]]
name = "Phylogenetics"
git = "https://github.com/vltanh/lean4-phylogenetics"
rev = "b56ce531644230622f069aaa8aa51a5143c1411e"

# The hub of this paper: Phylogenetic network estimation.
[[require]]
name = "PhyloNetwork"
git = "https://github.com/vltanh/lean4-phylo-network"
rev = "d069aaa85c4d9ee9d2a8746b71170f27c92a8633"

# Allman, Degnan, Rhodes 2011, whose four-taxon distributions the motivation of Algorithm 1 uses.
[[require]]
name = "Allman2011"
git = "https://github.com/vltanh/lean4-allman2011"
rev = "cd1c7b04f572d6cbc2b3c6f665b5932917fcad20"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "Camus"
globs = ["Camus.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
