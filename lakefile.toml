name = "Camus"
version = "0.1.0"
keywords = ["math", "phylogenetics"]
defaultTargets = ["Camus", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "ADR11"
git = "https://github.com/vltanh/lean4-adr11"
rev = "ed42599e5ad66a98a5761a7481d5112d1e0cdfec"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "Camus"
globs = ["Camus.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
