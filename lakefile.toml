name = "Camus"
version = "0.1.0"
keywords = ["math", "phylogenetics"]
description = "A Lean 4 formalization of Willson, Warnow 2026, CAMUS: Scalable Phylogenetic Network Estimation"
defaultTargets = ["Camus", "Palomar"]

[leanOptions]
autoImplicit = false
maxSynthPendingDepth = 3

# The root of the collection: the shared library of phylogenetics.
[[require]]
name = "Phylogenetics"
git = "https://github.com/vltanh/lean4-phylogenetics"
rev = "3fcabfd7d191990dda268b0b3968d945b65eb59a"

# The hub of this paper: Phylogenetic network estimation.
[[require]]
name = "PhyloNetwork"
git = "https://github.com/vltanh/lean4-phylo-network"
rev = "4ed2bb0f7085acbf1326f43e2a5c582ba4566125"

# Allman, Degnan, Rhodes 2011, whose four-taxon distributions the motivation of Algorithm 1 uses.
[[require]]
name = "Allman2011"
git = "https://github.com/vltanh/lean4-allman2011"
rev = "d4ada2c6cbbb5b8629eb9740dc5d5a9984a06a78"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

# Every module of the project is in Camus/, but its Challenge and its Solution, which are in
# palomar/ (lean4-phylogenetics, docs/CONVENTIONS.md, Sections 2 and 3). Lake fails on a glob whose
# directory, or a root whose file, does not exist.

# The paper's library, in the namespace Camus: general mathematics in Camus/Basic/, the results the
# paper cites in Camus/External/, the definitions of the Challenge in Camus/Defs.lean, and the
# paper's sections.
[[lean_lib]]
name = "Camus"
globs = ["Camus.+"]

# The paper's Challenge and Solution, the modules Camus.Challenge and Camus.Solution of the source
# directory palomar/ (Comparator: palomar/Camus/comparator.json). Declared last: Lake gives a module
# to the last library whose patterns match it, and the glob above matches these names when the
# paper's name is the root.
[[lean_lib]]
name = "Palomar"
srcDir = "palomar"
roots = ["Camus.Challenge", "Camus.Solution"]
